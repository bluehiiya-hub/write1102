<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안내문 템플릿 만들기 (시연용)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    font-size: 20px; color: #1e2a36; background: #fbf8f2; line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 24px; }
  h1 { font-size: 36px; color: #1f3a5f; margin: 8px 0 0; }
  .lead { color: #5b6470; margin: 0; }
  .card { background: #fff; border: 2px solid #e5e0d6; border-radius: 16px; padding: 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-weight: 700; font-size: 20px; margin-bottom: 6px; color: #1f3a5f; }
  input, textarea {
    width: 100%; font: inherit; font-size: 22px; padding: 12px 14px;
    border: 2px solid #c9d3e0; border-radius: 10px; background: #fff; color: #1e2a36;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, textarea:focus { outline: 3px solid #e8a33d; border-color: #1f3a5f; }
  .preview {
    white-space: pre-wrap; font-size: 24px; line-height: 1.7;
    background: #1f3a5f; color: #fbf8f2; border-radius: 16px; padding: 32px;
  }
  .btns { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; }
  button {
    font: inherit; font-size: 22px; font-weight: 700; padding: 14px 26px;
    border-radius: 12px; border: none; cursor: pointer;
  }
  .primary { background: #2a7f7a; color: #fff; }
  .ghost { background: #fff; color: #1f3a5f; border: 2px solid #1f3a5f; }
  .msg { font-size: 20px; color: #2a7f7a; font-weight: 700; min-height: 28px; margin: 8px 0 0; }
  .hint { font-size: 18px; color: #5b6470; margin: 0; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 30px; } }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>안내문 템플릿 만들기</h1>
    <p class="lead">빈 칸만 바꾸면 안내문이 완성됩니다. 다음 행사에도 같은 칸을 그대로 쓰세요.</p>
  </div>

  <div class="card">
    <div class="grid">
      <div class="full">
        <label for="title">행사 제목</label>
        <input id="title" value="대보름 행사 안내" placeholder="예: 대보름 행사 안내">
      </div>
      <div>
        <label for="date">날짜</label>
        <input id="date" value="2026-03-03" type="date">
      </div>
      <div>
        <label for="time">시간</label>
        <input id="time" value="오전 10시" placeholder="예: 오전 10시">
      </div>
      <div class="full">
        <label for="place">장소</label>
        <input id="place" value="부안옹기종기문화센터 4층 강의실" placeholder="예: 부안옹기종기문화센터 4층 강의실">
      </div>
      <div class="full">
        <label for="items">준비물</label>
        <input id="items" value="편한 복장, 개인 컵" placeholder="예: 편한 복장, 개인 컵">
      </div>
      <div class="full">
        <label for="content">행사 내용</label>
        <textarea id="content" placeholder="예: 오곡밥을 나누고 함께 윷놀이를 합니다.">오곡밥을 나누고 함께 윷놀이를 합니다.</textarea>
      </div>
      <div>
        <label for="contact">문의 담당자</label>
        <input id="contact" value="김정희 강사" placeholder="예: 김정희 강사">
      </div>
      <div>
        <label for="phone">문의 전화</label>
        <input id="phone" value="010-0000-0000" placeholder="예: 010-0000-0000" inputmode="tel">
      </div>
    </div>
    <div class="btns">
      <button class="ghost" id="reset" type="button">예시로 되돌리기</button>
      <button class="ghost" id="clear" type="button">칸 모두 비우기</button>
    </div>
  </div>

  <div class="card">
    <label>완성된 안내문</label>
    <div class="preview" id="preview"></div>
    <div class="btns">
      <button class="primary" id="copy" type="button">안내문 복사하기</button>
    </div>
    <p class="msg" id="msg"></p>
    <p class="hint">복사가 안 되면 안내문을 손가락으로 길게 눌러 직접 선택해 복사하세요.</p>
  </div>
</div>

<script>
  var FIELDS = ['title', 'date', 'time', 'place', 'items', 'content', 'contact', 'phone'];
  var DEFAULTS = {};
  FIELDS.forEach(function (id) { DEFAULTS[id] = document.getElementById(id).value; });

  function formatDate(v) {
    if (!v) return '';
    var p = v.split('-');
    if (p.length !== 3) return v;
    return p[0] + '년 ' + Number(p[1]) + '월 ' + Number(p[2]) + '일';
  }

  function val(id) { return document.getElementById(id).value.trim(); }

  function line(label, value) {
    return value ? label + ': ' + value + '\n' : '';
  }

  function build() {
    var title = val('title') || '행사 안내';
    var text = '[' + title + ']\n\n';
    text += line('일시', [formatDate(val('date')), val('time')].filter(Boolean).join(' '));
    text += line('장소', val('place'));
    text += line('준비물', val('items'));
    var content = val('content');
    if (content) text += '\n' + content + '\n';
    var contact = [val('contact'), val('phone')].filter(Boolean).join(' / ');
    if (contact) text += '\n문의: ' + contact + '\n';
    return text.replace(/\n{3,}/g, '\n\n').trim();
  }

  function render() {
    document.getElementById('preview').textContent = build();
  }

  function saveDraft() {
    try {
      var data = {};
      FIELDS.forEach(function (id) { data[id] = document.getElementById(id).value; });
      localStorage.setItem('notice-template-draft', JSON.stringify(data));
    } catch (e) { /* storage may be unavailable */ }
  }

  function loadDraft() {
    try {
      var raw = localStorage.getItem('notice-template-draft');
      if (!raw) return;
      var data = JSON.parse(raw);
      FIELDS.forEach(function (id) {
        if (typeof data[id] === 'string') document.getElementById(id).value = data[id];
      });
    } catch (e) { /* ignore */ }
  }

  function setMsg(t) { document.getElementById('msg').textContent = t; }

  FIELDS.forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      render();
      saveDraft();
      setMsg('');
    });
  });

  document.getElementById('reset').addEventListener('click', function () {
    FIELDS.forEach(function (id) { document.getElementById(id).value = DEFAULTS[id]; });
    render(); saveDraft(); setMsg('예시 내용으로 되돌렸습니다.');
  });

  document.getElementById('clear').addEventListener('click', function () {
    FIELDS.forEach(function (id) { document.getElementById(id).value = ''; });
    render(); saveDraft(); setMsg('모든 칸을 비웠습니다.');
  });

  document.getElementById('copy').addEventListener('click', function () {
    var text = build();
    var fallback = function () {
      var area = document.createElement('textarea');
      area.value = text;
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(area);
      setMsg(ok ? '안내문을 복사했습니다.' : '복사하지 못했습니다. 안내문을 길게 눌러 직접 복사하세요.');
    };
    try {
      navigator.clipboard.writeText(text).then(
        function () { setMsg('안내문을 복사했습니다.'); },
        fallback
      );
    } catch (e) { fallback(); }
  });

  loadDraft();
  render();
</script>
</body>
</html>
